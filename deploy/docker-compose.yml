services:
  notifs-api:
    # Published image (amd64 + arm64): `docker compose pull` to update. Pin a version by
    # setting HMD_IMAGE=ghcr.io/<owner>/hows-my-download-server:0.2.0 in deploy/.env.
    # `docker compose build` still builds from source instead, under the same name.
    image: ${HMD_IMAGE:-ghcr.io/w0nb0n/hows-my-download-server:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: notifs-api
    restart: unless-stopped
    ports:
      # Bind only to host loopback interface so traffic MUST flow through Nginx reverse proxy
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - STORE_TYPE=${STORE_TYPE:-firestore}
      - NOTIFIER_TYPE=${NOTIFIER_TYPE:-fcm}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json
    volumes:
      # Mount Firebase service account key in read-only mode
      - ./service-account.json:/app/service-account.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
