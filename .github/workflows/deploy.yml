name: Deploy

# Deploys a published server image to production, verifies it, and records it as a GitHub
# deployment (repo page > Deployments > production). Setup: docs/deployment.md.
#
#   v* tag -> "Server Image" pushes ghcr.io/<owner>/hows-my-download-server:<version>
#          -> this workflow (waits for approval if the environment requires it)
#          -> ssh hmd-deploy@server <version>   (the key can run nothing else)
#          -> the VM pulls, restarts, checks /health, and rolls back on failure
#          -> this workflow checks the version through the public HTTPS URL
#
# Manual run (Actions > Deploy > Run workflow) deploys any published version; an older
# version is a rollback. Forks skip it: it only runs where HMD_DEPLOY_ENABLED is 'true'.

on:
  workflow_run:
    workflows: ["Server Image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Published image version to deploy, e.g. 0.2.0 (an older one rolls back)"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: >-
      vars.HMD_DEPLOY_ENABLED == 'true' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          version="${INPUT_VERSION:-${TAG#v}}"
          if ! [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+|sha-[0-9a-f]{7,40})$ ]]; then
            echo "::error::Invalid version '$version' (expected e.g. 0.2.0 or sha-1a2b3c4)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Deploying **$version** to ${PRODUCTION_URL:-production}" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy over SSH (pull, restart, health check, rollback on failure)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          for name in SSH_KEY KNOWN_HOSTS DEPLOY_HOST DEPLOY_USER PRODUCTION_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured. See docs/deployment.md."
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server's forced command takes the version as its only input
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" "$VERSION"

      - name: Verify through the public URL
        run: |
          url="${PRODUCTION_URL%/}/health"
          for attempt in $(seq 1 15); do
            body=$(curl -fsS --max-time 10 "$url" || true)
            if [[ "$VERSION" == sha-* && "$body" == *'"status":"ok"'* ]] \
               || [[ "$body" == *"\"version\":\"$VERSION\""* ]]; then
              echo "$url -> $body"
              echo "Live: \`$body\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 4
          done
          echo "::error::$url did not report version $VERSION (last response: ${body:-none})"
          exit 1

      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
