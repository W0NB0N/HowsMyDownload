name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-ci:
    name: Backend Server (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Run Pytest Test Suite (with coverage)
        run: |
          pytest --verbose --cov --cov-report=term

  firestore-emulator:
    name: Firestore store (emulator)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up JDK 17 (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run store tests against the emulator
        run: |
          npx -y firebase-tools@13.35.1 emulators:exec --only firestore --project demo-hmd \
            --config tools/firestore-emulator/firebase.json \
            "cd server && pytest tests/test_firestore_emulator.py -o addopts= -v"

  android-ci:
    name: Android Client (Kotlin / Compose)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

  extension-ci:
    name: Chrome Extension (Manifest V3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate manifest.json schema
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            if (manifest.manifest_version !== 3) throw new Error('manifest_version must be 3');
            if (!manifest.name || !manifest.version) throw new Error('Missing name or version');
            console.log('✓ manifest.json is valid MV3: ' + manifest.name + ' v' + manifest.version);
          "

      - name: Run Extension Unit Tests (Poller, API client & AES Crypto)
        run: |
          node --test test_poller.js test_crypto.js test_api.js test_commands.js
