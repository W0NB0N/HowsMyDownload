name: Server Image

# Publishes the server as a multi-arch container image to GitHub Container Registry:
#   ghcr.io/<owner>/hows-my-download-server
# The image holds no secrets (the Firebase key is mounted at runtime), so self-hosters can
# pull it directly. A v* tag publishes <version>, <major>.<minor> and latest; a manual run
# publishes only sha-<commit> for testing.
#
# Needs no repository secrets: the built-in GITHUB_TOKEN can write packages.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Image name (registry paths must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hows-my-download-server" >> "$GITHUB_ENV"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=How's My Download server
            org.opencontainers.image.description=FastAPI relay that mirrors browser download progress to Android over FCM

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the amd64 image
        run: |
          tag=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name hmd -p 8000:8000 -e STORE_TYPE=memory -e NOTIFIER_TYPE=console "$tag"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; docker rm -f hmd; exit 0; fi
            sleep 1
          done
          docker logs hmd
          exit 1
