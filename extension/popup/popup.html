<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Notifs</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="terminal-card">
    <!-- Header -->
    <header class="header">
      <div class="title-row">
        <div class="pixel-icon" aria-hidden="true">
          <!-- 11x11 pixel logo -->
          <svg viewBox="0 0 11 11" width="18" height="18" shape-rendering="crispEdges">
            <rect width="11" height="11" fill="#141419" rx="2" />
            <rect x="1" y="1" width="3" height="3" fill="#8a05ff" />
            <rect x="7" y="1" width="3" height="3" fill="#8a05ff" />
            <rect x="4" y="1" width="3" height="1" fill="#61cf92" />
            <rect x="5" y="2" width="1" height="6" fill="#61cf92" />
            <rect x="4" y="5" width="3" height="1" fill="#61cf92" />
            <rect x="3" y="6" width="5" height="1" fill="#61cf92" />
            <rect x="2" y="7" width="7" height="1" fill="#61cf92" />
            <rect x="1" y="9" width="9" height="1" fill="#8a05ff" />
          </svg>
        </div>
        <div class="title-text">
          <span class="prompt-prefix">$</span>
          <span class="app-name">notifs</span>
          <span class="version-tag">v0.1</span>
        </div>
      </div>
      <div id="status-badge" class="badge badge-idle">
        <span class="status-dot"></span>
        <span class="status-label">IDLE</span>
      </div>
    </header>

    <!-- Sync Toggle -->
    <section class="section compact">
      <div class="field-row">
        <div class="label-with-icon">
          <span class="cli-flag">--sync</span>
          <span class="cli-desc">background tracking</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="enabled-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <!-- Config Fields -->
    <section class="section">
      <div class="field">
        <label for="server-url"><span class="cli-flag">--server</span> <span class="cli-dim">URL</span></label>
        <div class="input-wrapper">
          <input type="text" id="server-url" placeholder="http://localhost:8000" spellcheck="false" autocomplete="off" />
        </div>
      </div>
      <div class="field">
        <label for="pc-name"><span class="cli-flag">--client</span> <span class="cli-dim">hostname</span></label>
        <div class="input-wrapper">
          <input type="text" id="pc-name" placeholder="Desktop-PC" spellcheck="false" autocomplete="off" />
        </div>
      </div>
    </section>

    <!-- Active Downloads Monitor -->
    <section class="section">
      <div class="section-header">
        <div class="section-title">
          <span class="cli-flag">--active</span>
          <span class="cli-desc">downloads</span>
        </div>
        <span id="download-count" class="count-pill">0</span>
      </div>
      <div id="downloads-container" class="downloads-list">
        <div class="empty-state">
          <span class="cli-dim">// no transfers in progress</span>
        </div>
      </div>
    </section>

    <!-- Pairing Box -->
    <section class="section" id="pairing-section">
      <div class="section-header">
        <div class="section-title">
          <span class="cli-flag">--pair</span>
          <span class="cli-desc">mobile relay</span>
        </div>
        <span id="pairing-status" class="pairing-status-badge">UNPAIRED</span>
      </div>
      <div class="pairing-box">
        <button id="pair-btn" class="btn btn-primary">
          <svg viewBox="0 0 11 11" width="11" height="11" class="btn-pixel-icon" shape-rendering="crispEdges">
            <rect x="3" y="1" width="5" height="4" fill="#61cf92" />
            <rect x="4" y="2" width="3" height="3" fill="#141419" />
            <rect x="2" y="5" width="7" height="5" fill="#8a05ff" />
            <rect x="5" y="7" width="1" height="2" fill="#61cf92" />
          </svg>
          <span>pair device</span>
        </button>
        <div id="qr-container" class="qr-box hidden">
          <div class="qr-placeholder">// qr handshake active in phase 6</div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <button id="export-trace-btn" class="btn btn-ghost" title="Export recorded JSON sample trace for testing">
        <span class="cli-prompt">&gt;</span> export trace
      </button>
      <span id="last-sample-time" class="timestamp">--:--:--</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
