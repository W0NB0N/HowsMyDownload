<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How's My Download</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="terminal-card">
    <!-- Header -->
    <header class="header">
      <div class="title-row">
        <div class="pixel-icon" aria-hidden="true">
          <img src="../icons/icon16.png" width="18" height="18" alt="logo" style="image-rendering: pixelated; border-radius: 3px;" />
        </div>
        <div class="title-text">
          <span class="prompt-prefix">$</span>
          <span class="app-name">how's my download</span>
          <span class="version-tag">v0.1</span>
        </div>
      </div>
      <div id="status-badge" class="badge badge-idle">
        <span class="status-dot"></span>
        <span class="status-label">IDLE</span>
      </div>
    </header>

    <!-- Sync Toggle -->
    <section class="section compact">
      <div class="field-row">
        <div class="label-with-icon">
          <span class="cli-flag">--sync</span>
          <span class="cli-desc">background tracking</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="enabled-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <!-- Config Fields -->
    <section class="section">
      <div class="field">
        <div class="field-label-row">
          <label for="server-url"><span class="cli-flag">--server</span> <span class="cli-dim">URL</span></label>
          <span id="server-status-pill" class="server-pill pill-checking">
            <span class="pill-dot"></span>
            <span class="pill-text">CHECKING</span>
          </span>
        </div>
        <div class="input-wrapper">
          <input type="text" id="server-url" placeholder="http://localhost:8000" spellcheck="false" autocomplete="off" />
        </div>
        <div id="server-error-text" class="field-error-text hidden"></div>
      </div>
      <div class="field">
        <label for="pc-name"><span class="cli-flag">--client</span> <span class="cli-dim">hostname</span></label>
        <div class="input-wrapper">
          <input type="text" id="pc-name" placeholder="Desktop-PC" spellcheck="false" autocomplete="off" />
        </div>
      </div>
    </section>

    <!-- Active Downloads Monitor -->
    <section class="section">
      <div class="section-header">
        <div class="section-title">
          <span class="cli-flag">--active</span>
          <span class="cli-desc">downloads</span>
        </div>
        <span id="download-count" class="count-pill">0</span>
      </div>
      <div id="downloads-container" class="downloads-list">
        <div class="empty-state">
          <span class="cli-dim">// no transfers in progress</span>
        </div>
      </div>
    </section>

    <!-- Pairing Section -->
    <section class="section" id="pairing-section">
      <div class="section-header">
        <div class="section-title">
          <span class="cli-flag">--pair</span>
          <span class="cli-desc">mobile relay</span>
        </div>
        <span id="pairing-status-badge" class="pairing-status-badge status-unpaired">UNPAIRED</span>
      </div>

      <div class="pairing-box">
        <!-- Unpaired Action -->
        <div id="pairing-unpaired-view">
          <button id="pair-btn" class="btn btn-primary">
            <img src="pair-icon.png" width="11" height="11" class="btn-pixel-icon" alt="pair icon" />
            <span>pair device</span>
          </button>
        </div>

        <!-- Active QR Code View -->
        <div id="qr-container" class="qr-box hidden">
          <div class="qr-canvas-wrapper">
            <canvas id="qr-canvas"></canvas>
          </div>
          <div class="qr-info">
            <div class="qr-code-row">
              <span class="cli-dim">CODE:</span>
              <span id="qr-code-text" class="qr-code-value">------</span>
            </div>
            <div id="qr-expiry-text" class="qr-expiry-label">expires in 5m</div>
          </div>
          <button id="qr-cancel-btn" class="btn btn-ghost">cancel</button>
        </div>

        <!-- Paired View -->
        <div id="pairing-paired-view" class="paired-details hidden">
          <div class="paired-row">
            <span class="paired-led"></span>
            <span id="paired-device-text" class="paired-title">Paired with Mobile Relay</span>
          </div>
          <button id="rotate-secret-btn" class="btn btn-secondary">
            <span>&gt; rotate secret</span>
          </button>
          <button id="unpair-btn" class="btn btn-danger">
            <span>&gt; unpair device</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <button id="export-trace-btn" class="btn btn-ghost" title="Export recorded JSON sample trace for testing">
        <span class="cli-prompt">&gt;</span> export trace
      </button>
      <span id="last-sample-time" class="timestamp">--:--:--</span>
    </footer>
  </div>

  <script src="qrcode.js"></script>
  <script src="popup.js"></script>
</body>
</html>
